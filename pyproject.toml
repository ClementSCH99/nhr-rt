[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nhr9300"
version = "0.2.0"
description = "Safe, typed Python driver and test runner for NH Research NHR9300 cyclers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
service = ["PyYAML>=6.0"]
ivi = [
    "comtypes==1.4.16; platform_system == 'Windows'",
    "PyYAML>=6.0",
]
test = [
    "PyYAML>=6.0",
    "pytest>=8.0",
]

[project.scripts]
nhr9300-service = "nhr9300.service:main"
nhr9300-run = "nhr9300.cli:main"
nhr9300-monitor = "nhr9300.monitor:main"
nhr9300-doctor = "nhr9300.diagnostics:doctor_main"
nhr9300-bundle = "nhr9300.diagnostics:bundle_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhr9300 = ["monitor_assets/*.html", "monitor_assets/*.css", "monitor_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware_readonly: requires a configured physical NHR9300; never writes",
    "hardware_energizing: may energize a physical NHR9300; requires explicit opt-in",
]
